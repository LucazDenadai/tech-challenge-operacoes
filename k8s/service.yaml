# NodePort fixo: o cluster Kind expõe 30092 na porta 8092 da máquina (tech-challenge-infra-k8s/kind/cluster.yaml).
apiVersion: v1
kind: Service
metadata:
  name: operacoes
spec:
  type: NodePort
  selector: { app: operacoes }
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30092 }
